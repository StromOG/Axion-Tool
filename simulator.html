// ---------- procedural icons (fallback when icons_data.js absent) ----------
function drawGlyph(x,y,kind,col){
  ctx.save();ctx.translate(x,y);ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=1.6;
  const S=22;
  if(kind==='cam'){ctx.strokeRect(2,6,18,13);ctx.beginPath();ctx.arc(11,12.5,4,0,7);ctx.stroke();ctx.fillRect(7,3,6,3);}
  else if(kind==='gallery'){ctx.strokeRect(2,4,18,14);ctx.beginPath();ctx.moveTo(4,16);ctx.lineTo(9,10);ctx.lineTo(13,14);ctx.lineTo(16,11);ctx.lineTo(19,16);ctx.stroke();ctx.beginPath();ctx.arc(7,8,1.6,0,7);ctx.fill();}
  else if(kind==='sd'){ctx.beginPath();ctx.moveTo(4,2);ctx.lineTo(15,2);ctx.lineTo(19,6);ctx.lineTo(19,20);ctx.lineTo(4,20);ctx.closePath();ctx.stroke();for(let i=0;i<4;i++)ctx.fillRect(6+i*3,3,1.4,3);}
  else if(kind==='spectrum'){ctx.beginPath();ctx.moveTo(3,18);ctx.lineTo(6,12);ctx.lineTo(9,17);ctx.lineTo(12,5);ctx.lineTo(15,14);ctx.lineTo(18,8);ctx.lineTo(20,18);ctx.stroke();for(let i=4;i<=18;i+=4)ctx.fillRect(i-1,19,2,2);}
  else if(kind==='radio'){ctx.beginPath();ctx.arc(11,16,2,0,7);ctx.fill();for(let r=5;r<=11;r+=3){ctx.beginPath();ctx.arc(11,16,r,-2.4,-0.75);ctx.stroke();}}
  else if(kind==='wifi'){ctx.beginPath();ctx.arc(11,17,2,0,7);ctx.fill();for(let r=5;r<=12;r+=3.5){ctx.beginPath();ctx.arc(11,17,r,-2.5,-0.64);ctx.stroke();}}
  else if(kind==='bt'){ctx.beginPath();ctx.moveTo(8,5);ctx.lineTo(15,9);ctx.lineTo(8,14);ctx.lineTo(8,2);ctx.lineTo(15,7);ctx.lineTo(8,11);ctx.stroke();}
  else if(kind==='subghz'){ctx.beginPath();ctx.moveTo(2,16);ctx.lineTo(5,16);ctx.lineTo(5,8);ctx.lineTo(9,8);ctx.lineTo(9,16);ctx.lineTo(13,16);ctx.lineTo(13,6);ctx.lineTo(17,6);ctx.lineTo(17,16);ctx.lineTo(20,16);ctx.stroke();}
  else if(kind==='ir'){ctx.strokeRect(4,10,14,9);ctx.beginPath();ctx.moveTo(11,10);ctx.lineTo(11,3);ctx.moveTo(8,5);ctx.lineTo(14,5);ctx.stroke();ctx.beginPath();ctx.arc(11,14.5,2,0,7);ctx.fill();}
  else if(kind==='note'){ctx.strokeRect(4,3,14,16);ctx.beginPath();ctx.moveTo(7,7);ctx.lineTo(15,7);ctx.moveTo(7,11);ctx.lineTo(15,11);ctx.moveTo(7,15);ctx.lineTo(12,15);ctx.stroke();}
  else if(kind==='game'){ctx.beginPath();ctx.moveTo(4,8);ctx.lineTo(7,5);ctx.lineTo(15,5);ctx.lineTo(18,8);ctx.lineTo(18,17);ctx.lineTo(15,19);ctx.lineTo(7,19);ctx.lineTo(4,17);ctx.closePath();ctx.stroke();ctx.fillRect(6,11,4,2);ctx.fillRect(7,10,2,4);ctx.fillRect(13,10,2,2);ctx.fillRect(15,12,2,2);}
  else if(kind==='info'){ctx.beginPath();ctx.arc(11,11,8.5,0,7);ctx.stroke();ctx.fillRect(10,6,2,2.5);ctx.fillRect(10,10.5,2,6);}
  else if(kind==='cfg'){ctx.beginPath();ctx.arc(11,11,4,0,7);ctx.stroke();for(let i=0;i<8;i++){const a=i*Math.PI/4;ctx.beginPath();ctx.moveTo(11+Math.cos(a)*6,11+Math.sin(a)*6);ctx.lineTo(11+Math.cos(a)*8.5,11+Math.sin(a)*8.5);ctx.stroke();}}
  else{ctx.strokeRect(4,4,14,14);}
  ctx.restore();

}
function drawIcon(x,y,kind,col,bg){
  ctx.fillStyle=bg;ctx.fillRect(x,y,22,22);

}

let audioCtx = null;
function playBuzzer(freq, durationMs) {
  if (!settings.sound) return; // Muted from settings
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + durationMs / 1000);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + durationMs / 1000);
  } catch(e) {}
}

// ---------- helpers ----------
function drawCyberGraffitiHUD(x, y, tag, primaryCol, accentCol){
  tag = tag || 'AXION';
  primaryCol = primaryCol || C.cyan;
  accentCol = accentCol || C.amber;

  // Stencil Slash Hazard
  ctx.strokeStyle = accentCol; ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(x - 5, y + 14); ctx.lineTo(x + 2, y - 2);
  ctx.moveTo(x - 3, y + 14); ctx.lineTo(x + 4, y - 2);
  ctx.stroke();

  ctx.strokeStyle = primaryCol;
  ctx.beginPath();
  ctx.moveTo(x - 1, y + 15); ctx.lineTo(x + 6, y - 3);
  ctx.stroke();

  // Shadow underglow
  F(10);
  ctx.fillStyle = C.panel;
  ctx.fillText(tag, x + 11, y + 12);

  // Stencil Chromatic shift
  ctx.fillStyle = accentCol;
  ctx.fillText(tag, x + 9, y + 10);
  ctx.fillStyle = primaryCol;
  ctx.fillText(tag, x + 10, y + 11);

  // Sparks / Drips
  const tagLen = ctx.measureText(tag).width;
  const endX = x + 12 + tagLen;
  ctx.fillStyle = primaryCol;
  ctx.fillRect(endX + 2, y + 6, 8, 1);
  ctx.fillStyle = accentCol;
  ctx.fillRect(endX + 4, y + 9, 5, 1);
  ctx.fillRect(endX + 12, y + 7, 2, 2);
  ctx.fillRect(x + 16, y + 15, 1.5, 1.5);
}

function topBar(title,accent){
  ctx.fillStyle=C.panel;ctx.fillRect(0,0,240,20);ctx.fillStyle=accent;ctx.fillRect(0,20,240,1);
  // Graffiti hazard spray slashes before title
  ctx.strokeStyle=C.amber;ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(2,17);ctx.lineTo(7,3);ctx.stroke();
  ctx.strokeStyle=accent;ctx.beginPath();ctx.moveTo(6,17);ctx.lineTo(11,3);ctx.stroke();
  ctx.fillStyle=accent;ctx.fillRect(13,16,2,2);

  F(10);ctx.fillStyle=accent;ctx.fillText(title,16,14);
  const bx=192;ctx.strokeStyle=accent;ctx.lineWidth=1;ctx.strokeRect(bx,5,20,10);ctx.fillStyle=accent;ctx.fillRect(bx+20,7,2,6);ctx.fillStyle=C.green;ctx.fillRect(bx+2,7,14,6);
  ctx.fillStyle=accent;ctx.fillText('96%',bx-26,14);
}
function bottomBar(hint){ctx.fillStyle=C.panel;ctx.fillRect(0,304,240,16);ctx.fillStyle=C.dim;ctx.fillRect(0,303,240,1);
  F(9);ctx.fillStyle=C.grey;ctx.fillText(hint,6,315);}
function centerText(t,y,col,px){F(px||10);ctx.fillStyle=col;const w=ctx.measureText(t).width;ctx.fillText(t,(240-w)/2,y);}

function applyBrightness(){
  const pct=settings.bright; if(pct>=100)return;
  const dark=100-pct;let acc=0;ctx.fillStyle='#000';
  for(let y=0;y<320;y++){acc+=dark;if(acc>=100){acc-=100;ctx.fillRect(0,y,240,1);}}
}

// ---------- SHARED AXION CYBER STAR LOGO (Hardware & Simulator) ----------
function drawAxionStarLogo(cx, cy, size, glowAlpha, drawChevrons) {
  if (size < 4) return;
  const R = size;
  const r = size * 0.28; // Concave waist pinch

  // Cardinal tips: Up, Down, Left, Right
  const tU = { x: cx,        y: cy - R };
  const tD = { x: cx,        y: cy + R };
  const tL = { x: cx - R,    y: cy };
  const tR = { x: cx + R,    y: cy };

  // Diagonal inner waist vertices
  const wUR = { x: cx + r * 0.707, y: cy - r * 0.707 };
  const wDR = { x: cx + r * 0.707, y: cy + r * 0.707 };
  const wDL = { x: cx - r * 0.707, y: cy + r * 0.707 };
  const wUL = { x: cx - r * 0.707, y: cy - r * 0.707 };

  // Celestial shading colors (Starlight Cyan & Celestial Blue contrast)
  const colLight = C.cyan;
  const colDark  = C.stellar;
  const colEdge  = glowAlpha > 0.5 ? C.white : C.cyan;

  function tri(p1, p2, p3, col) {
    ctx.fillStyle = col;
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.lineTo(p3.x, p3.y);
    ctx.closePath();
    ctx.fill();
  }

  const c = { x: cx, y: cy };
  // Upper-Right quadrant (Starlight Cyan)
  tri(c, tU, wUR, colLight);
  tri(c, wUR, tR, colLight);

  // Lower-Right quadrant (Deep Celestial Indigo)
  tri(c, tR, wDR, colDark);
  tri(c, wDR, tD, colDark);

  // Lower-Left quadrant (Starlight Cyan)
  tri(c, tD, wDL, colLight);
  tri(c, wDL, tL, colLight);

  // Upper-Left quadrant (Deep Celestial Indigo)
  tri(c, tL, wUL, colDark);
  tri(c, wUL, tU, colDark);

  // Perimeter outlines
  ctx.strokeStyle = colEdge;
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(tU.x, tU.y); ctx.lineTo(wUR.x, wUR.y); ctx.lineTo(tR.x, tR.y);
  ctx.lineTo(wDR.x, wDR.y); ctx.lineTo(tD.x, tD.y); ctx.lineTo(wDL.x, wDL.y);
  ctx.lineTo(tL.x, tL.y); ctx.lineTo(wUL.x, wUL.y); ctx.closePath();
  ctx.stroke();

  // Center crosshair divider
  ctx.strokeStyle = C.white;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(tU.x, tU.y); ctx.lineTo(tD.x, tD.y);
  ctx.moveTo(tL.x, tL.y); ctx.lineTo(tR.x, tR.y);
  ctx.stroke();

  // 4 Outer Chevrons pointing outward at each cardinal tip (Cyan glow)
  if (drawChevrons) {
    const dist = R + 7;
    const span = Math.max(4, R * 0.26);
    ctx.strokeStyle = glowAlpha > 0.6 ? C.cyan : C.dim;
    ctx.lineWidth = 1.6;

    // Top (^)
    ctx.beginPath();
    ctx.moveTo(cx - span, cy - dist + span);
    ctx.lineTo(cx, cy - dist);
    ctx.lineTo(cx + span, cy - dist + span);
    ctx.stroke();

    // Bottom (v)
    ctx.beginPath();
    ctx.moveTo(cx - span, cy + dist - span);
    ctx.lineTo(cx, cy + dist);
    ctx.lineTo(cx + span, cy + dist - span);
    ctx.stroke();

    // Left (<)
    ctx.beginPath();
    ctx.moveTo(cx - dist + span, cy - span);
    ctx.lineTo(cx - dist, cy);
    ctx.lineTo(cx - dist + span, cy + span);
    ctx.stroke();

    // Right (>)
    ctx.beginPath();
    ctx.moveTo(cx + dist - span, cy - span);
    ctx.lineTo(cx + dist, cy);
    ctx.lineTo(cx + dist - span, cy + span);
    ctx.stroke();
  }
}


// ---------- BOOT (Hyperspace Galaxy Theme) ----------
let bootStart = 0;
const warpStars = Array.from({length: 48}, (_, i) => ({
  angle: i * (Math.PI * 2 / 48) + (i % 5) * 0.12,
  dist: ((i * 17) % 130 + 10),
  speed: 1.2 + (i % 7) * 0.5,
  size: (i % 3 === 0) ? 2 : 1
}));

const bootStages = [
  'OCTAL PSRAM 8MB // HYPERBUS LOCK',
  'HIGH-SPEED SDMMC BUS MOUNTED',
  'OV3660 ISP SENSOR CALIBRATED',
  'RADIO & RF MATRIX ARMED',
  'AXION CYBER CORE // READY'
];

function renderBoot(ts) {
  if (!bootStart) bootStart = ts;
  let elapsed = ts - bootStart;
  let p = elapsed / 2500; if (p > 1) p = 1;
  const elapsedSec = elapsed * 0.001;
  const cx = 120, cy = 110;

  // Deep cosmic black background
  ctx.fillStyle = C.bg;
  ctx.fillRect(0, 0, 240, 320);

  // 1. Radial Hyperspace Warp Starfield
  const warpSpeedFactor = (p < 0.25) ? (p / 0.25 * 2.8) : 1.6;
  for (let i = 0; i < warpStars.length; i++) {
    const st = warpStars[i];
    st.dist += st.speed * warpSpeedFactor * 1.5;
    if (st.dist > 160) st.dist = 6;

    const ang = st.angle + elapsedSec * 0.15;
    const px = cx + Math.cos(ang) * st.dist;
    const py = cy + Math.sin(ang) * st.dist;

    const tailLen = st.dist * 0.12;
    const tx = cx + Math.cos(ang) * (st.dist - tailLen);
    const ty = cy + Math.sin(ang) * (st.dist - tailLen);

    ctx.save();
    let col = (st.size === 2) ? C.white : C.cyan;
    if (st.dist < 30) col = C.dim;
    ctx.strokeStyle = col;
    ctx.lineWidth = st.size === 2 ? 1.4 : 1;
    ctx.beginPath();
    ctx.moveTo(tx, ty);
    ctx.lineTo(px, py);
    ctx.stroke();

    if (st.size === 2 && st.dist > 45) {
      ctx.fillStyle = C.white;
      ctx.fillRect(px - 0.5, py - 0.5, 1.5, 1.5);
    }
    ctx.restore();
  }

  // 2. Cosmic Nebula Orbiting Wave Rings
  const wavePulse = Math.sin(elapsedSec * 4.5) * 4;
  ctx.save();
  const radGrad = ctx.createRadialGradient(cx, cy, 8, cx, cy, 64 + wavePulse);
  radGrad.addColorStop(0, 'rgba(155, 81, 224, 0.32)');
  radGrad.addColorStop(0.55, 'rgba(51, 119, 255, 0.14)');
  radGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = radGrad;
  ctx.beginPath();
  ctx.arc(cx, cy, 64 + wavePulse, 0, 7);
  ctx.fill();

  ctx.strokeStyle = 'rgba(155, 81, 224, 0.4)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(cx, cy, 52 - wavePulse * 0.6, 0, 7); ctx.stroke();
  ctx.strokeStyle = 'rgba(0, 240, 255, 0.25)';
  ctx.beginPath(); ctx.arc(cx, cy, 40 + wavePulse * 0.8, 0, 7); ctx.stroke();

  // 4 Orbiting Energy Nodes
  for (let k = 0; k < 4; k++) {
    const orbAng = elapsedSec * 2.4 + k * (Math.PI * 2 / 4);
    const ox = cx + Math.cos(orbAng) * (52 - wavePulse * 0.6);
    const oy = cy + Math.sin(orbAng) * (52 - wavePulse * 0.6);
    ctx.fillStyle = (k % 2 === 0) ? C.white : C.cyan;
    ctx.beginPath(); ctx.arc(ox, oy, 1.6, 0, 7); ctx.fill();
  }
  ctx.restore();

  // 3. Faceted Star Logo: Smooth fade-in, rock-solid stable size (no pulsing)
  let starScale = 38;
  if (p < 0.20) {
    const bp = p / 0.20;
    starScale = 38 * (1 - (1 - bp) * (1 - bp));
  } else {
    starScale = 38; // Stable, fixed scale
  }

  drawAxionStarLogo(cx, cy, starScale, p, p > 0.15);

  // 4. Subtle Clean Starlight Center Glint (pure soft central spark, no criss-cross lines)
  if (p > 0.18) {
    ctx.save();
    ctx.fillStyle = C.white;
    ctx.beginPath(); ctx.arc(cx, cy, 2.5, 0, 7); ctx.fill();
    ctx.strokeStyle = C.cyan; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(cx, cy, 3.5, 0, 7); ctx.stroke();
    ctx.restore();
  }


  // 5. Hologram Typographic Title Reveal
  let rc = 0; if (p > 0.34) rc = Math.min(5, Math.floor((p - 0.34) / 0.42 * 5) + 1);
  if (rc > 0) {
    const t = 'AXION'.slice(0, rc);
    ctx.font = 'bold 30px Orbitron';
    const tw = ctx.measureText('AXION').width;
    // Ambient violet shadow
    ctx.fillStyle = C.nebula;
    ctx.fillText(t, (240 - tw) / 2 + 1, 185);
    // Electric starlight cyan foreground
    ctx.fillStyle = C.cyan;
    ctx.fillText(t, (240 - tw) / 2, 184);
  }

  if (p > 0.52) {
    F(10);
    centerText('CYBER MULTI-TOOL // DUAL CORE', 214, C.white, 10);
    centerText('ESP32-S3 N16R8 v2.5.0', 227, C.grey, 10);
  }

  // 6. Sleek Starlight Capsule Progress Bar
  const barX = 26, barY = 254, barW = 188, barH = 6;
  ctx.strokeStyle = C.dim; ctx.lineWidth = 1;
  rr(barX - 2, barY - 2, barW + 4, barH + 4, 3); ctx.stroke();
  const fillW = Math.max(0, Math.floor(barW * p));
  if (fillW > 0) {
    const pGrad = ctx.createLinearGradient(barX, barY, barX + fillW, barY);
    pGrad.addColorStop(0, C.stellar);
    pGrad.addColorStop(0.85, C.cyan);
    pGrad.addColorStop(1, C.white);
    ctx.fillStyle = pGrad;
    rr(barX, barY, fillW, barH, 2); ctx.fill();

    // Gloss top shine stripe
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillRect(barX, barY + 1, fillW, 1.2);
  }

  const si = Math.min(4, Math.floor(p * 5));
  centerText(p >= 1 ? 'SYSTEMS ARMED // ALL CORES READY' : bootStages[si], 274, p >= 1 ? C.cyan : C.grey, 10);

  if (p >= 1 && !bootStart.done) {
    bootStart.done = true;
    setTimeout(() => { mode = 'MENU'; }, 260);
  }
}

  const saveSel = (simKbdRow === -1 && simKbdCol === 1);
  ctx.fillStyle = saveSel ? C.green : C.surface; rr(saveX, tbY, saveW, tbH, 3); ctx.fill();
  ctx.strokeStyle = saveSel ? C.white : C.green; rr(saveX, tbY, saveW, tbH, 3); ctx.stroke();
  ctx.fillStyle = saveSel ? C.bg : C.green; F(8); ctx.fillText('SAVE', saveX + 6, tbY + 12);

  // Symmetrical 10-Key x 4-Row Virtual Keyboard (Keys: 20x16px, 3px pad)
  const kY = dy + 38, keyW = 20, keyH = 16, kPad = 3;
  for (let r = 0; r < 4; r++) {
    const rStartX = dx + 5;
    for (let c = 0; c < 10; c++) {
      const kx = rStartX + c * (keyW + kPad);
      const ky = kY + r * (keyH + kPad);
      const isSel = (r === simKbdRow && c === simKbdCol);
      ctx.fillStyle = isSel ? C.cyan : C.surface; rr(kx, ky, keyW, keyH, 2); ctx.fill();
      if (isSel) { ctx.strokeStyle = C.white; rr(kx, ky, keyW, keyH, 2); ctx.stroke(); }
      ctx.fillStyle = isSel ? C.bg : C.white; F(9);
      ctx.fillText(simKbdRows[r][c], kx + 7, ky + 12);
    }
  }
}

// ---------- NOTEPAD TEXT EDITOR (REVAMPED CYBER EDITOR) ----------
let noteContent = "";
let noteFileCount = 1;
let noteName = "note_001";
let noteNamingStep = false;
let noteKbdRow = 0;
let noteKbdCol = 0;
let noteToastUntil = 0;
let noteExitPrompt = false;
let noteExitChoice = 0; // 0 = SAVE & EXIT, 1 = DISCARD
let noteIsDirty = false;

function renderNotepad(){
  topBar('NOTEPAD // CYBER EDITOR', C.cyan);

  // Document Page Surface (y = 22 to 194, h = 172px)
  const docX = 4, docY = 22, docW = 232, docH = 172;
  ctx.fillStyle = C.surface; rr(docX, docY, docW, docH, 4); ctx.fill();
  ctx.strokeStyle = C.dim; rr(docX, docY, docW, docH, 4); ctx.stroke();

  // File header ribbon inside document
  const charCount = noteContent.length;
  F(9); ctx.fillStyle = C.cyan;
  ctx.fillText('FILE: ', docX + 6, docY + 11);
  ctx.fillStyle = C.white;
  ctx.fillText(noteName + '.TXT', docX + 38, docY + 11);

  const statInfo = `${charCount}B  C:${charCount}`;
  const statW = ctx.measureText(statInfo).width;
  ctx.fillStyle = C.grey;
  ctx.fillText(statInfo, docX + docW - statW - 6, docY + 11);

  // Subtle header separator line
  ctx.strokeStyle = 'rgba(0, 229, 255, 0.25)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(docX + 2, docY + 15); ctx.lineTo(docX + docW - 2, docY + 15); ctx.stroke();

  // Margin line for line numbering
  ctx.strokeStyle = '#086255'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(docX + 22, docY + 16); ctx.lineTo(docX + 22, docY + docH - 2); ctx.stroke();

  // Line numbers & text layout
  F(9);
  const textX = docX + 26, textY = docY + 27, lineSpacing = 12, maxLines = 12;
  let cx = textX, cy = textY, curLine = 0;

  // Draw initial line number "01"
  ctx.fillStyle = C.dim;
  ctx.fillText('01', docX + 5, textY);

  if (noteContent.length === 0) {
    ctx.fillStyle = 'rgba(0, 229, 255, 0.45)';
    ctx.fillText('[ CLEAN NEW FILE - TYPE BELOW ]', textX, textY);
    cx = textX;
  } else {
    ctx.fillStyle = C.white;
    for (let i = 0; i < noteContent.length; i++) {
      const ch = noteContent[i];
      if (ch === '\n') {
        curLine++;
        cx = textX;
        cy += lineSpacing;
        if (curLine >= maxLines) break;
        ctx.fillStyle = C.dim;
        ctx.fillText(String(curLine + 1).padStart(2, '0'), docX + 5, cy);
        ctx.fillStyle = C.white;
        continue;
      }
      const cw = ctx.measureText(ch).width;
      if (cx + cw > docX + docW - 8) {
        curLine++;
        cx = textX;
        cy += lineSpacing;
        if (curLine >= maxLines) break;
        ctx.fillStyle = C.dim;
        ctx.fillText(String(curLine + 1).padStart(2, '0'), docX + 5, cy);
        ctx.fillStyle = C.white;
      }
      ctx.fillText(ch, cx, cy);
      cx += cw;
    }
  }

  // Blinking active cursor
  if (!noteNamingStep && Math.floor(Date.now() / 350) % 2 === 0) {
    ctx.fillStyle = C.cyan;
    ctx.fillRect(cx + 1, cy - 8, 4, 10);
  }

  // Save Toast Notification overlay
  if (Date.now() < noteToastUntil) {
    const tw = 180, th = 30;
    const tx = (240 - tw) / 2;
    const ty = docY + 50;
    ctx.fillStyle = C.panel; rr(tx, ty, tw, th, 4); ctx.fill();
    ctx.strokeStyle = C.green; rr(tx, ty, tw, th, 4); ctx.stroke();
    F(9); ctx.fillStyle = C.green;
    ctx.fillText('FILE SAVED TO /NOTEPAD', tx + 20, ty + 18);
  }

  // Virtual Cyber Keyboard Docked at bottom (y = 196 to 300, h = 104)
  if (noteNamingStep) {
    const savedNamingBuf = simNamingBuffer;
    const savedRow = simKbdRow;
    const savedCol = simKbdCol;
    simNamingBuffer = noteName;
    simKbdRow = noteKbdRow;
    simKbdCol = noteKbdCol;
    renderNamingDialog('SAVE TO /NOTEPAD', 'TXT');
    simNamingBuffer = savedNamingBuf;
    simKbdRow = savedRow;
    simKbdCol = savedCol;
    return;
  }

  const kbX = 4, kbY = 196, kbW = 232, kbH = 104;
  ctx.fillStyle = C.panel; rr(kbX, kbY, kbW, kbH, 4); ctx.fill();
  ctx.strokeStyle = C.cyan; rr(kbX, kbY, kbW, kbH, 4); ctx.stroke();

  // Row -1: Action Bar (5 fast action keys: [DEL], [SPACE], [ENTER], [NEW], [SAVE])
  const actLabels = ["DEL", "SPACE", "ENTER", "NEW", "SAVE"];
  const actColors = [C.crimson, C.cyan, C.amber, C.grey, C.green];
  const actW = [38, 44, 44, 38, 46];
  let curAx = kbX + 6;

  F(9);
  for (let a = 0; a < 5; a++) {
    const sel = (noteKbdRow === -1 && noteKbdCol === a);
    const col = actColors[a];
    ctx.fillStyle = sel ? col : C.surface;
    rr(curAx, kbY + 4, actW[a], 16, 2); ctx.fill();
    ctx.strokeStyle = sel ? C.white : col;
    rr(curAx, kbY + 4, actW[a], 16, 2); ctx.stroke();

    ctx.fillStyle = sel ? '#000000' : col;
    const lw = ctx.measureText(actLabels[a]).width;
    ctx.fillText(actLabels[a], curAx + (actW[a] - lw) / 2, kbY + 15);
    curAx += actW[a] + 4;
  }

  // Rows 0..3: 10-Key x 4-Row Character Matrix
  const kbdMatrix = [
    "1234567890",
    "QWERTYUIOP",
    "ASDFGHJKL-",
    "ZXCVBNM.,/"
  ];
  const kStartY = kbY + 24;
  const kKeyW = 20, kKeyH = 16, kPad = 3;

  for (let r = 0; r < 4; r++) {
    const rStartX = kbX + 5;
    for (let c = 0; c < 10; c++) {
      const kx = rStartX + c * (kKeyW + kPad);
      const ky = kStartY + r * (kKeyH + kPad);
      const isSel = (noteKbdRow === r && noteKbdCol === c);

      ctx.fillStyle = isSel ? C.cyan : C.surface;
      rr(kx, ky, kKeyW, kKeyH, 2); ctx.fill();
      if (isSel) {
        ctx.strokeStyle = C.white;
        rr(kx, ky, kKeyW, kKeyH, 2); ctx.stroke();
      }

      ctx.fillStyle = isSel ? '#000000' : C.white;
      ctx.fillText(kbdMatrix[r][c], kx + 7, ky + 12);
    }
  }

  // Exit Confirmation Dialog Overlay (SAVE vs DISCARD)
  if (noteExitPrompt) {
    const pw = 216, ph = 96;
    const px = (240 - pw) / 2;
    const py = 88;

    // Dark modal backdrop with amber cyber border
    ctx.fillStyle = C.panel; rr(px, py, pw, ph, 5); ctx.fill();
    ctx.strokeStyle = C.amber; ctx.lineWidth = 2; rr(px, py, pw, ph, 5); ctx.stroke();
    ctx.lineWidth = 1;

    // Header warning
    F(10); ctx.fillStyle = C.amber;
    ctx.fillText('! UNSAVED NOTE CHANGES !', px + 18, py + 20);

    // Subtitle message
    F(9); ctx.fillStyle = C.white;
    ctx.fillText('Save or discard before exit?', px + 18, py + 34);

    // Option Buttons: [SAVE & EXIT] vs [DISCARD]
    const btnW = 90, btnH = 22;
    const btnY = py + 46;

    // Button 0: SAVE & EXIT
    const b0X = px + 12;
    const b0Sel = (noteExitChoice === 0);
    ctx.fillStyle = b0Sel ? C.green : C.surface;
    rr(b0X, btnY, btnW, btnH, 3); ctx.fill();
    ctx.strokeStyle = b0Sel ? C.white : C.green;
    rr(b0X, btnY, btnW, btnH, 3); ctx.stroke();
    ctx.fillStyle = b0Sel ? '#000000' : C.green;
    ctx.fillText('SAVE & EXIT', b0X + 14, btnY + 15);

    // Button 1: DISCARD
    const b1X = px + pw - btnW - 12;
    const b1Sel = (noteExitChoice === 1);
    ctx.fillStyle = b1Sel ? C.crimson : C.surface;
    rr(b1X, btnY, btnW, btnH, 3); ctx.fill();
    ctx.strokeStyle = b1Sel ? C.white : C.crimson;
    rr(b1X, btnY, btnW, btnH, 3); ctx.stroke();
    ctx.fillStyle = b1Sel ? C.white : C.crimson;
    ctx.fillText('DISCARD', b1X + 22, btnY + 15);

    // Footer hint
    ctx.fillStyle = C.grey;
    ctx.fillText('L/R:Select  CLICK:OK  MENU:Cancel', px + 18, py + 84);

    bottomBar('L/R:Select  CLICK:Confirm  MENU:Cancel');
    return;
  }

  bottomBar('JOY:Keys  CLICK:Type  SHUTTER:Save  MENU:Exit');
}

function drawSpaceBackground(px, py, pw, ph, seed, now){
  // Deep space base
  ctx.fillStyle = '#03050b';
  rr(px, py, pw, ph, 4); ctx.fill();

  // Pseudo-random twinkling stars
  let rng = (seed === 0) ? 133742 : (seed >>> 0);
  for(let i = 0; i < 34; i++){
    rng = (rng * 1664525 + 1013904223) >>> 0;
    const sx = px + 4 + (rng % (pw - 8));
    rng = (rng * 1664525 + 1013904223) >>> 0;
    const sy = py + 22 + (rng % (ph - 26));

    const twinkle = ((Math.floor(now / 320) + i * 5) % 6 === 0);
    const starCol = (i % 3 === 0) ? C.cyan : (i % 5 === 0 ? C.amber : C.white);
    if(twinkle){
      ctx.fillStyle = C.white;
      ctx.fillRect(sx, sy, 1.8, 1.8);
      if(i % 4 === 0){
        ctx.fillStyle = 'rgba(0, 240, 255, 0.4)';
        ctx.fillRect(sx - 1, sy, 3.8, 1.8);
        ctx.fillRect(sx, sy - 1, 1.8, 3.8);
      }
    } else {
      ctx.fillStyle = (i % 2 === 0) ? starCol : C.dim;
      ctx.fillRect(sx, sy, 1.2, 1.2);
    }
  }

  // Randomized celestial scenery
  const celestialType = (seed & 0x7fff) % 4;
  if(celestialType === 0){
    // Ringed Gas Giant Planet (Upper Right)
    const cx = px + pw - 46, cy = py + 54, r = 14;
    ctx.fillStyle = C.panel; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
    ctx.strokeStyle = C.cyan; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.stroke();
    ctx.strokeStyle = C.dim; ctx.beginPath(); ctx.arc(cx + 1, cy, r - 3, 0, 7); ctx.stroke();
    // Planetary rings
    ctx.strokeStyle = C.amber; ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.ellipse(cx, cy, 24, 7, -0.3, 0, Math.PI * 2);
    ctx.stroke();
  } else if(celestialType === 1){
    // Glowing Cyber Moon with craters (Upper Left)
    const cx = px + 46, cy = py + 58, r = 16;
    ctx.fillStyle = C.panel; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
    ctx.strokeStyle = C.white; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.stroke();
    ctx.fillStyle = C.dim;
    ctx.beginPath(); ctx.arc(cx - 5, cy - 3, 3, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 4, cy + 4, 4, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(cx - 2, cy + 7, 2, 0, 7); ctx.fill();
  } else if(celestialType === 2){
    // Distant Binary Sun System (Upper Center)
    const cx1 = px + pw / 2 - 20, cy1 = py + 46;
    const cx2 = cx1 + 26, cy2 = cy1 - 8;
    ctx.fillStyle = C.amber; ctx.beginPath(); ctx.arc(cx1, cy1, 9, 0, 7); ctx.fill();
    ctx.strokeStyle = C.white; ctx.stroke();
    ctx.fillStyle = C.cyan; ctx.beginPath(); ctx.arc(cx2, cy2, 6, 0, 7); ctx.fill();
    ctx.strokeStyle = C.white; ctx.stroke();
  } else {
    // Cosmic Nebula Cloud formation
    const nx = px + pw / 2, ny = py + 52;
    ctx.fillStyle = 'rgba(155, 81, 224, 0.25)';
    ctx.beginPath(); ctx.arc(nx - 22, ny + 4, 14, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(nx, ny - 6, 18, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(nx + 20, ny + 2, 12, 0, 7); ctx.fill();
  }

  // Outer border
  ctx.strokeStyle = C.cyan; rr(px, py, pw, ph, 4); ctx.stroke();
}

function renderGames(){
  const titles=['CYBER ARCADE // SELECT','GAME // CYBER SNAKE','GAME // NEON PONG','GAME // CYBER FLAPPY','GAME // NEON BREAKOUT'];
  topBar(titles[simGameId]||titles[0], C.green);

  const px=6, py=24, pw=228, ph=250;

  if(simGameId===0){
    ctx.fillStyle=C.surface; rr(px,py,pw,ph,4); ctx.fill();
    ctx.strokeStyle=C.cyan; rr(px,py,pw,ph,4); ctx.stroke();

    // Games Menu (4 arcade games)
    centerText('SELECT MINI-GAME', py+14, C.green, 11);
    const gNames=[
      '1. CYBER SNAKE',
      '2. NEON PONG',
      '3. CYBER FLAPPY',
      '4. NEON BREAKOUT'
    ];
    const gDescs=[
      'Retro crawler // Space grid',
      'Neon duel // AI paddle match',
      'Thrust flight // Cosmic conduits',
      'Arcade brick smash // Rebound'
    ];

    for(let i=0;i<4;i++){
      const gy=py+36+i*48, sel=(simGameSel===i);
      ctx.fillStyle=sel?C.panel:C.surface; rr(px+6,gy,pw-12,42,4); ctx.fill();
      ctx.strokeStyle=sel?C.green:C.dim; rr(px+6,gy,pw-12,42,4); ctx.stroke();

      if(sel){
        ctx.fillStyle=C.green; rr(px+6,gy+2,4,38,2); ctx.fill();
        ctx.fillStyle=C.green; F(11); ctx.fillText('> ',px+14,gy+18);
      }
      F(11); ctx.fillStyle=sel?C.white:C.cyan; ctx.fillText(gNames[i],px+24,gy+18);
      F(9); ctx.fillStyle=C.grey; ctx.fillText(gDescs[i],px+24,gy+34);
    }
    bottomBar('JOY:Select  CLICK:Play  MENU:Exit');
    return;
  }

  const now=Date.now();

  // GAMEPLAY: Draw dynamic randomized space background
  drawSpaceBackground(px, py, pw, ph, simSpaceSeed, now);

  // Header score
  F(10); ctx.fillStyle=C.green;
  ctx.fillText('SCORE: '+String(simGameScore).padStart(4,'0')+'   HIGH: '+String(simHighScore[simGameId]).padStart(4,'0'), px+10, py+14);
  ctx.strokeStyle=C.dim; ctx.beginPath(); ctx.moveTo(px+2,py+19); ctx.lineTo(px+pw-2,py+19); ctx.stroke();

  if(simGameId===1){
    // CYBER SNAKE
    // Food
    ctx.fillStyle=C.crimson; ctx.beginPath(); ctx.arc(px+6+simFood.x*8+4, py+24+simFood.y*8+4, 3.5, 0, 7); ctx.fill();
    ctx.strokeStyle=C.white; ctx.stroke();

    // Snake
    for(let i=0;i<simSnake.length;i++){
      ctx.fillStyle=(i===0)?C.white:(i%2===0?C.green:C.cyan);
      ctx.fillRect(px+6+simSnake[i].x*8+1, py+24+simSnake[i].y*8+1, 6, 6);
    }

    if(simSubState===0 && now-simLastTick>110){
      simLastTick=now;
      let hx=simSnake[0].x, hy=simSnake[0].y;
      if(simSnakeDir===0)hx++; else if(simSnakeDir===1)hy++;
      else if(simSnakeDir===2)hx--; else if(simSnakeDir===3)hy--;

      if(hx<0||hx>=27||hy<0||hy>=27){
        simSubState=2; playBuzzer(400, 50);
        if(simGameScore>simHighScore[1])simHighScore[1]=simGameScore;
      } else {
        for(let i=0;i<simSnake.length;i++){
          if(simSnake[i].x===hx && simSnake[i].y===hy){
            simSubState=2; playBuzzer(400, 50);
            if(simGameScore>simHighScore[1])simHighScore[1]=simGameScore;
            break;
          }
        }
      }

      if(simSubState===0){
        simSnake.unshift({x:hx,y:hy});
        if(hx===simFood.x && hy===simFood.y){
          simGameScore+=10; playBuzzer(2400, 10);
          simFood={x:Math.floor(Math.random()*25)+1, y:Math.floor(Math.random()*25)+1};
          if(simGameScore>simHighScore[1])simHighScore[1]=simGameScore;
        } else {
          simSnake.pop();
        }
      }
    }
  } else if(simGameId===2){
    // NEON PONG
    const padW=4, padH=34;
    ctx.fillStyle=C.cyan; rr(px+8, simPongPlayerY, padW, padH, 2); ctx.fill();
    ctx.fillStyle=C.crimson; rr(px+pw-12, simPongAiY, padW, padH, 2); ctx.fill();

    // Center Net
    ctx.strokeStyle=C.dim; ctx.lineWidth=1;
    for(let ny=py+22; ny<py+ph-10; ny+=10){
      ctx.beginPath(); ctx.moveTo(px+pw/2, ny); ctx.lineTo(px+pw/2, ny+5); ctx.stroke();
    }

    // Ball
    ctx.fillStyle=C.white; ctx.beginPath(); ctx.arc(simBallX, simBallY, 3, 0, 7); ctx.fill();
    ctx.strokeStyle=C.green; ctx.stroke();

    if(simSubState===0 && now-simLastTick>30){
      simLastTick=now;
      simBallX+=simBallVx; simBallY+=simBallVy;

      // AI follow
      if(simBallY > simPongAiY+17 && simPongAiY < 235) simPongAiY+=2.2;
      else if(simBallY < simPongAiY+17 && simPongAiY > 35) simPongAiY-=2.2;

      // Top / Bottom bounce
      if(simBallY <= py+24 || simBallY >= py+ph-8){
        simBallVy=-simBallVy; playBuzzer(1400, 5);
      }

      // Player bounce
      if(simBallX <= px+14 && simBallX >= px+6 && simBallY >= simPongPlayerY && simBallY <= simPongPlayerY+padH){
        simBallVx=Math.abs(simBallVx); simGameScore+=5; playBuzzer(2000, 8);
        if(simGameScore>simHighScore[2])simHighScore[2]=simGameScore;
      }

      // AI bounce
      if(simBallX >= px+pw-14 && simBallX <= px+pw-6 && simBallY >= simPongAiY && simBallY <= simPongAiY+padH){
        simBallVx=-Math.abs(simBallVx); playBuzzer(1600, 8);
      }

      // Score / Miss
      if(simBallX < px+4){
        simSubState=2; playBuzzer(400, 40);
      } else if(simBallX > px+pw-2){
        simGameScore+=20; simBallX=120; simBallY=150; simBallVx=-3; playBuzzer(2600, 15);
        if(simGameScore>simHighScore[2])simHighScore[2]=simGameScore;
      }
    }
  } else if(simGameId===3){
    // CYBER FLAPPY (Drone navigating space conduits)
    const birdX=50, birdY=simFlappyY;
    const pipeW=20, gapH=68;

    // Glowing drone bird with thruster spark
    ctx.fillStyle=C.amber; ctx.beginPath(); ctx.arc(birdX, birdY, 5, 0, 7); ctx.fill();
    ctx.strokeStyle=C.white; ctx.stroke();
    ctx.strokeStyle=C.cyan; ctx.beginPath(); ctx.moveTo(birdX-8, birdY); ctx.lineTo(birdX-2, birdY); ctx.stroke();

    // Top and bottom pipes
    if(simPipeX+pipeW>px && simPipeX<px+pw){
      const topH=simPipeGapY-(py+20);
      if(topH>0){
        ctx.fillStyle=C.panel; ctx.fillRect(simPipeX, py+20, pipeW, topH);
        ctx.strokeStyle=C.green; ctx.strokeRect(simPipeX, py+20, pipeW, topH);
        ctx.fillStyle=C.green; ctx.fillRect(simPipeX-2, py+20+topH-6, pipeW+4, 6);
      }
      const botY=simPipeGapY+gapH;
      const botH=(py+ph)-botY;
      if(botH>0){
        ctx.fillStyle=C.panel; ctx.fillRect(simPipeX, botY, pipeW, botH);
        ctx.strokeStyle=C.green; ctx.strokeRect(simPipeX, botY, pipeW, botH);
        ctx.fillStyle=C.green; ctx.fillRect(simPipeX-2, botY, pipeW+4, 6);
      }
    }

    if(simSubState===0 && now-simLastTick>30){
      simLastTick=now;
      simFlappyVy+=0.35;
      if(simFlappyVy>6.0) simFlappyVy=6.0;
      simFlappyY+=simFlappyVy;
      simPipeX-=3;

      if(simPipeX<-25){
        simPipeX=230;
        simPipeGapY=50+Math.floor(Math.random()*100);
        simGameScore+=10; playBuzzer(2400, 10);
        if(simGameScore>simHighScore[3])simHighScore[3]=simGameScore;
      }

      // Collisions
      if(simFlappyY<=py+22 || simFlappyY>=py+ph-8){
        simSubState=2; playBuzzer(400, 50);
        if(simGameScore>simHighScore[3])simHighScore[3]=simGameScore;
      }
      if(simFlappyY>py+22 && simFlappyY<py+ph-8){
        if(birdX+5>=simPipeX && birdX-5<=simPipeX+pipeW){
          if(simFlappyY-5<simPipeGapY || simFlappyY+5>simPipeGapY+gapH){
            simSubState=2; playBuzzer(400, 50);
            if(simGameScore>simHighScore[3])simHighScore[3]=simGameScore;
          }
        }
      }
    }
  } else if(simGameId===4){
    // NEON BREAKOUT (Space brick breaker)
    const padW=38, padH=5;
    const padY=py+ph-12;

    // Paddle
    ctx.fillStyle=C.cyan; rr(simBreakoutPadX, padY, padW, padH, 2); ctx.fill();
    ctx.strokeStyle=C.white; rr(simBreakoutPadX, padY, padW, padH, 2); ctx.stroke();

    // Ball
    ctx.fillStyle=C.white; ctx.beginPath(); ctx.arc(simBreakoutBallX, simBreakoutBallY, 3, 0, 7); ctx.fill();
    ctx.strokeStyle=C.amber; ctx.stroke();

    // Bricks
    for(let r=0;r<3;r++){
      for(let c=0;c<8;c++){
        const bidx=r*8+c;
        if(simBreakoutBricks[bidx]){
          const bx=px+12+c*26;
          const by=py+28+r*14;
          ctx.fillStyle=(r===0)?C.crimson:(r===1?C.amber:C.green);
          ctx.fillRect(bx, by, 22, 10);
          ctx.strokeStyle=C.white; ctx.strokeRect(bx, by, 22, 10);
        }
      }
    }

    if(simSubState===0 && now-simLastTick>25){
      simLastTick=now;
      simBreakoutBallX+=simBreakoutBallVx;
      simBreakoutBallY+=simBreakoutBallVy;

      // Wall bounces
      if(simBreakoutBallX<=px+8){
        simBreakoutBallX=px+8; simBreakoutBallVx=Math.abs(simBreakoutBallVx);
        playBuzzer(1400, 4);
      } else if(simBreakoutBallX>=px+pw-8){
        simBreakoutBallX=px+pw-8; simBreakoutBallVx=-Math.abs(simBreakoutBallVx);
        playBuzzer(1400, 4);
      }

      if(simBreakoutBallY<=py+20){
        simBreakoutBallY=py+20; simBreakoutBallVy=Math.abs(simBreakoutBallVy);
        playBuzzer(1400, 4);
      }

      // Paddle bounce
      if(simBreakoutBallY>=padY-4 && simBreakoutBallY<=padY+4 &&
         simBreakoutBallX>=simBreakoutPadX-4 && simBreakoutBallX<=simBreakoutPadX+padW+4){
        simBreakoutBallVy=-Math.abs(simBreakoutBallVy);
        const hitOff=simBreakoutBallX-(simBreakoutPadX+padW/2);
        if(hitOff<-8) simBreakoutBallVx=-3;
        else if(hitOff>8) simBreakoutBallVx=3;
        playBuzzer(1900, 8);
      }

      // Brick destruction
      let aliveCount=0;
      for(let r=0;r<3;r++){
        for(let c=0;c<8;c++){
          const bidx=r*8+c;
          if(simBreakoutBricks[bidx]){
            aliveCount++;
            const bx=px+12+c*26;
            const by=py+28+r*14;
            if(simBreakoutBallX>=bx-3 && simBreakoutBallX<=bx+25 &&
               simBreakoutBallY>=by-3 && simBreakoutBallY<=by+13){
              simBreakoutBricks[bidx]=0;
              simBreakoutBallVy=-simBreakoutBallVy;
              simGameScore+=15;
              playBuzzer(2200, 8);
              if(simGameScore>simHighScore[4])simHighScore[4]=simGameScore;
              aliveCount--;
            }
          }
        }
      }

      if(aliveCount===0){
        simBreakoutBricks.fill(1);
        simGameScore+=100;
        playBuzzer(2700, 20);
      }

      if(simBreakoutBallY>=py+ph-4){
        simSubState=2; playBuzzer(400, 50);
        if(simGameScore>simHighScore[4])simHighScore[4]=simGameScore;
      }
    }
  }

  if(simSubState===2){
    // Game Over Overlay
    const gw=160, gh=50, gx=(240-gw)/2, gy=(320-gh)/2;
    ctx.fillStyle=C.panel; rr(gx,gy,gw,gh,5); ctx.fill();
    ctx.strokeStyle=C.crimson; rr(gx,gy,gw,gh,5); ctx.stroke();
    F(10); ctx.fillStyle=C.crimson; ctx.fillText('GAME OVER', gx+46, gy+18);
    F(9); ctx.fillStyle=C.white; ctx.fillText('CLICK / SNAP: Restart', gx+26, gy+36);
  }

  bottomBar('JOY:Controls  CLICK:Action  MENU:Exit');
}

const settingAdjust={bright:[10,10,100],stillQ:[1,4,20],cbri:[1,-2,2],ccon:[1,-2,2],csat:[1,-2,2],csharp:[1,-3,3],cden:[1,0,8],cev:[1,-2,2],hop:[1,1,10]};
const settingCycle={scene:5,stillRes:4,cgain:7,cwb:5,grid:4};
function settableItems(){return buildSettings().map((it,i)=>({it,i})).filter(x=>!x.it.h);}
function handleInput(b){
  if(mode==='BOOT')return;
  if(mode==='MENU'){
    if(b==='UP')menuSel=(menuSel-1+MENU.length)%MENU.length;
    if(b==='DOWN')menuSel=(menuSel+1)%MENU.length;
    if(b==='CLICK'||b==='SHUTTER'){
      mode=['CAMERA','GALLERY','FILES','NOTEPAD','GAMES','NRF','WIFI','BLE','SUBGHZ','IR','GUIDE','SETTINGS'][menuSel];
      if(mode==='FILES'){fePath='/';feSel=0;feView=false;}
      if(mode==='GUIDE'){guidePage=0;}
      if(mode==='NOTEPAD'){
        noteContent = "";
        noteName = "note_" + String(noteFileCount).padStart(3, '0');
        noteNamingStep = false;
        noteKbdRow = 0;
        noteKbdCol = 0;
        noteToastUntil = 0;
        noteIsDirty = false;
        noteExitPrompt = false;
        noteExitChoice = 0;
      }
      if(mode==='GAMES'){simGameId=0;simSubState=0;}
    }
    return;
  }

  if(mode==='CAMERA'){
    if(simNamingActive){
      if(b==='MENU'){simNamingActive=false;return;}
      if(b==='UP'){
        if(simKbdRow===-1)simKbdRow=3;
        else if(simKbdRow===0){simKbdRow=-1;simKbdCol=simKbdCol>=5?1:0;}
        else simKbdRow--;
      }
      if(b==='DOWN'){
        if(simKbdRow===-1){simKbdRow=0;simKbdCol=simKbdCol===1?8:4;}
        else if(simKbdRow===3){simKbdRow=-1;simKbdCol=simKbdCol>=5?1:0;}
        else simKbdRow++;
      }
      if(b==='LEFT'){
        if(simKbdRow===-1)simKbdCol=simKbdCol===1?0:1;
        else simKbdCol=(simKbdCol-1+10)%10;
      }
      if(b==='RIGHT'){
        if(simKbdRow===-1)simKbdCol=simKbdCol===0?1:0;
        else simKbdCol=(simKbdCol+1)%10;
      }

      if(b==='CLICK'){
        if(simKbdRow===-1&&simKbdCol===0){
          // DEL
          if(simNamingBuffer.length>0)simNamingBuffer=simNamingBuffer.slice(0,-1);
        } else if(simKbdRow===-1&&simKbdCol===1){
          // SAVE
          if(!simNamingBuffer)simNamingBuffer=settings.imgPrefix;
          savedFileName=simNamingBuffer+'.JPG';
          settings.imgIndex++;
          media.push({v:false});
          freezeUntil=Date.now()+800;
          simNamingActive=false;
          playBuzzer(2400, 30);
        } else if(simKbdRow>=0&&simKbdRow<4&&simKbdCol>=0&&simKbdCol<10){
          if(simNamingBuffer.length<24){
            simNamingBuffer+=simKbdRows[simKbdRow][simKbdCol];
            playBuzzer(1900, 6);
          }
        }
      } else if(b==='SHUTTER'){
        // Instant save with current buffer
        if(!simNamingBuffer)simNamingBuffer=settings.imgPrefix;
        savedFileName=simNamingBuffer+'.JPG';
        settings.imgIndex++;
        media.push({v:false});
        freezeUntil=Date.now()+800;
        simNamingActive=false;
        playBuzzer(2400, 30);
      }
      return;
    }

    if(b==='MENU'){if(quickSel>=0){quickSel=-1;return;}mode='MENU';return;}
    if(quickSel>=0){
      if(b==='UP')quickSel=(quickSel-1+quickItems.length)%quickItems.length;
      if(b==='DOWN')quickSel=(quickSel+1)%quickItems.length;
      if(b==='LEFT'||b==='RIGHT'||b==='CLICK'){const d=b==='LEFT'?-1:1;
        playBuzzer(1700, 8);
        switch(quickSel){case 0:camScene=(camScene+1)%5;break;case 1:camStillRes=(camStillRes+1)%4;break;
          case 2:camFx=(camFx+d+8)%8;break;case 3:camWb=(camWb+1)%5;break;case 4:camBright=Math.max(-2,Math.min(2,camBright+d));break;
          case 5:camEV=Math.max(-2,Math.min(2,camEV+d));break;case 6:camGrid=(camGrid+1)%4;break;case 7:camZoom=Math.max(1,Math.min(3,camZoom+d*0.5));break;
          case 8:camFlip=!camFlip;break;case 9:camMirror=!camMirror;break;case 10:quickSel=-1;freezeUntil=Date.now()+600;break;
          case 11:camTimelapse=!camTimelapse;quickSel=-1;break;case 12:quickSel=-1;break;}}
    } else {
      if(b==='CLICK'){quickSel=0;playBuzzer(1600,10);return;}
      if(b==='LEFT')camFx=(camFx-1+8)%8;if(b==='RIGHT')camScene=(camScene+1)%5;
      if(b==='UP')camEV=Math.min(2,camEV+1);if(b==='DOWN')camEV=Math.max(-2,camEV-1);
      if(b==='SHUTTER'){
        if(camRec){
          camRec=false;
          camRecAnim=Date.now()+400;camRecAnimType='stop';
          playBuzzer(1000, 30);
        }
        else{
          if(settings.promptNaming){
            simNamingActive=true;
            if(settings.imgIndex===1)simNamingBuffer=settings.imgPrefix;
            else simNamingBuffer=settings.imgPrefix+settings.imgIndex;
            simKbdRow=-1;simKbdCol=1; // Focus on top SAVE button
            playBuzzer(2000, 15);
          } else {
            savedFileName=(settings.imgIndex===1?settings.imgPrefix:settings.imgPrefix+settings.imgIndex)+'.JPG';
            settings.imgIndex++;
            freezeUntil=Date.now()+800;
            media.push({v:false});
            playBuzzer(2400, 25);
          }
        }
      }
      if(b==='HOLD'){
        camRec=!camRec;
        if(camRec){camRecStart=Date.now();camRecAnim=Date.now()+400;camRecAnimType='start';playBuzzer(2000, 40);}
        else{camRecAnim=Date.now()+400;camRecAnimType='stop';playBuzzer(1000, 30);}
      }
    }
    return;
  }
  if(mode==='GALLERY'){
    if(vidOpen){if(b==='MENU'){vidOpen=false;}if(b==='CLICK')vidPlaying=!vidPlaying;if(b==='LEFT')vidFrame=0;if(b==='RIGHT')vidFrame+=10;return;}
    if(b==='MENU')mode='MENU';
    if(b==='LEFT')galIdx=(galIdx-1+media.length)%media.length;
    if(b==='RIGHT')galIdx=(galIdx+1)%media.length;
    if(b==='CLICK'){if(media[galIdx]&&media[galIdx].v){vidOpen=true;vidPlaying=true;vidFrame=0;}
      else if(media.length>1){media.splice(galIdx,1);if(galIdx>=media.length)galIdx=media.length-1;}}
    return;
  }
  if(mode==='NOTEPAD'){
    // Modal Exit Confirmation Handling (SAVE vs DISCARD)
    if(noteExitPrompt){
      if(b==='MENU'){
        noteExitPrompt = false;
        playBuzzer(1200, 8);
        return;
      }
      if(b==='LEFT'){
        noteExitChoice = 0;
        playBuzzer(1400, 4);
      } else if(b==='RIGHT'){
        noteExitChoice = 1;
        playBuzzer(1400, 4);
      } else if(b==='UP' || b==='DOWN'){
        noteExitChoice = 1 - noteExitChoice;
        playBuzzer(1400, 4);
      } else if(b==='CLICK' || b==='SHUTTER'){
        if(noteExitChoice === 0){
          // SAVE & EXIT: commit to SD card, chirp, wipe buffer, and exit
          if(!noteName) noteName = "note_" + String(noteFileCount).padStart(3, '0');
          const fn = noteName + '.TXT';
          if(!FS['/NOTEPAD']) FS['/NOTEPAD'] = [];
          const existing = FS['/NOTEPAD'].find(x => x.n === fn);
          if(existing){ existing.sz = noteContent.length; }
          else { FS['/NOTEPAD'].push({ n: fn, d: false, sz: noteContent.length }); }
          noteFileCount++;
          noteIsDirty = false;
          noteExitPrompt = false;
          noteContent = "";
          playBuzzer(2600, 25);
          mode = 'MENU';
        } else {
          // DISCARD & EXIT: discard changes without saving, wipe buffer, warn tone, and exit
          noteIsDirty = false;
          noteExitPrompt = false;
          noteContent = "";
          playBuzzer(800, 30);
          mode = 'MENU';
        }
      }
      return;
    }

    if(b==='MENU'){
      if(noteNamingStep){
        noteNamingStep=false;
        noteKbdRow=-1; noteKbdCol=4;
        playBuzzer(1000, 10);
        return;
      }
      // Check if anything is written and note has unsaved changes
      if(noteIsDirty && noteContent.length > 0){
        noteExitPrompt = true;
        noteExitChoice = 0; // Default to SAVE & EXIT for data safety
        playBuzzer(2000, 15);
        return;
      }
      mode='MENU';
      return;
    }
    if(b==='UP'){
      if(noteKbdRow===-1){
        noteKbdRow=3;
        noteKbdCol=(noteKbdCol*2 < 10) ? noteKbdCol*2 : 9;
      } else if(noteKbdRow===0){
        noteKbdRow=-1;
        noteKbdCol=(noteKbdCol < 2) ? 0 : (noteKbdCol < 4 ? 1 : (noteKbdCol < 6 ? 2 : (noteKbdCol < 8 ? 3 : 4)));
      } else {
        noteKbdRow--;
      }
      playBuzzer(1400, 4);
    } else if(b==='DOWN'){
      if(noteKbdRow===-1){
        noteKbdRow=0;
        noteKbdCol=(noteKbdCol*2 < 10) ? noteKbdCol*2 : 9;
      } else if(noteKbdRow===3){
        noteKbdRow=-1;
        noteKbdCol=(noteKbdCol < 2) ? 0 : (noteKbdCol < 4 ? 1 : (noteKbdCol < 6 ? 2 : (noteKbdCol < 8 ? 3 : 4)));
      } else {
        noteKbdRow++;
      }
      playBuzzer(1400, 4);
    } else if(b==='LEFT'){
      if(noteKbdRow===-1) noteKbdCol=(noteKbdCol - 1 + 5) % 5;
      else noteKbdCol=(noteKbdCol - 1 + 10) % 10;
      playBuzzer(1400, 4);
    } else if(b==='RIGHT'){
      if(noteKbdRow===-1) noteKbdCol=(noteKbdCol + 1) % 5;
      else noteKbdCol=(noteKbdCol + 1) % 10;
      playBuzzer(1400, 4);
    }

    if(b==='CLICK'){
      if(noteKbdRow===-1){
        // Action Bar: 0:DEL, 1:SPACE, 2:ENTER, 3:NEW, 4:SAVE
        if(noteKbdCol===0){
          // DEL
          if(noteContent.length>0){
            noteContent=noteContent.slice(0, -1);
            noteIsDirty = true;
            playBuzzer(1200, 8);
          }
        } else if(noteKbdCol===1){
          // SPACE
          if(noteContent.length<480){
            noteContent += ' ';
            noteIsDirty = true;
            playBuzzer(1700, 6);
          }
        } else if(noteKbdCol===2){
          // ENTER
          if(noteContent.length<480){
            noteContent += '\n';
            noteIsDirty = true;
            playBuzzer(1500, 8);
          }
        } else if(noteKbdCol===3){
          // NEW (Wipe and start fresh clean file)
          noteFileCount++;
          noteContent = "";
          noteName = "note_" + String(noteFileCount).padStart(3, '0');
          noteNamingStep = false;
          noteKbdRow = 0;
          noteKbdCol = 0;
          noteToastUntil = 0;
          noteIsDirty = false;
          playBuzzer(1000, 20);
        } else if(noteKbdCol===4){
          // SAVE
          if(!noteName) noteName = "note_" + String(noteFileCount).padStart(3, '0');
          const fn = noteName + '.TXT';
          if(!FS['/NOTEPAD']) FS['/NOTEPAD'] = [];
          const existing = FS['/NOTEPAD'].find(x => x.n === fn);
          if(existing){ existing.sz = noteContent.length; }
          else { FS['/NOTEPAD'].push({ n: fn, d: false, sz: noteContent.length }); }
          noteFileCount++;
          noteToastUntil = Date.now() + 2500;
          noteIsDirty = false;
          playBuzzer(2600, 25);
        }
      } else if(noteKbdRow>=0 && noteKbdRow<4 && noteKbdCol>=0 && noteKbdCol<10){
        const kbdMatrix = [
          "1234567890",
          "QWERTYUIOP",
          "ASDFGHJKL-",
          "ZXCVBNM.,/"
        ];
        const ch = kbdMatrix[noteKbdRow][noteKbdCol];
        if(noteContent.length<480){
          noteContent += ch;
          noteIsDirty = true;
          playBuzzer(1900, 6);
        }
      }
    } else if(b==='SHUTTER'){
      // Fast instant save shortcut
      if(!noteName) noteName = "note_" + String(noteFileCount).padStart(3, '0');
      const fn = noteName + '.TXT';
      if(!FS['/NOTEPAD']) FS['/NOTEPAD'] = [];
      const existing = FS['/NOTEPAD'].find(x => x.n === fn);
      if(existing){ existing.sz = noteContent.length; }
      else { FS['/NOTEPAD'].push({ n: fn, d: false, sz: noteContent.length }); }
      noteFileCount++;
      noteToastUntil = Date.now() + 2500;
      noteIsDirty = false;
      playBuzzer(2600, 25);
    }
    return;
  }
  if(mode==='GAMES'){
    if(b==='MENU'){
      if(simGameId>0){simGameId=0;simSubState=0;playBuzzer(1200,10);return;}
      mode='MENU';return;
    }
    if(simGameId===0){
      if(b==='UP'){simGameSel=(simGameSel-1+4)%4;playBuzzer(1400,5);}
      else if(b==='DOWN'){simGameSel=(simGameSel+1)%4;playBuzzer(1400,5);}
      else if(b==='CLICK'||b==='SHUTTER'){
        simGameId=simGameSel+1;
        simSpaceSeed=Math.floor(Math.random()*10000);
        playBuzzer(2200,15);
        if(simGameId===1)resetSimSnake();
        else if(simGameId===2)resetSimPong();
        else if(simGameId===3)resetSimFlappy();
        else if(simGameId===4)resetSimBreakout();
      }
      return;
    }
    if(simSubState===2){
      if(b==='CLICK'||b==='SHUTTER'){
        playBuzzer(2000,15);
        simSpaceSeed=Math.floor(Math.random()*10000);
        if(simGameId===1)resetSimSnake();
        else if(simGameId===2)resetSimPong();
        else if(simGameId===3)resetSimFlappy();
        else if(simGameId===4)resetSimBreakout();
      }
      return;
    }
    if(simGameId===1){
      if(b==='UP'&&simSnakeDir!==1)simSnakeDir=3;
      else if(b==='DOWN'&&simSnakeDir!==3)simSnakeDir=1;
      else if(b==='LEFT'&&simSnakeDir!==0)simSnakeDir=2;
      else if(b==='RIGHT'&&simSnakeDir!==2)simSnakeDir=0;
    } else if(simGameId===2){
      if(b==='UP')simPongPlayerY=Math.max(30,simPongPlayerY-10);
      else if(b==='DOWN')simPongPlayerY=Math.min(240,simPongPlayerY+10);
    } else if(simGameId===3){
      if(b==='UP'||b==='CLICK'||b==='SHUTTER'){
        simFlappyVy=-4.5; playBuzzer(1900,8);
      }
    } else if(simGameId===4){
      if(b==='LEFT') simBreakoutPadX=Math.max(14, simBreakoutPadX-10);
      else if(b==='RIGHT') simBreakoutPadX=Math.min(188, simBreakoutPadX+10);
    }
    return;
  }
  if(mode==='FILES'){

    if(feRenaming){
      if(b==='MENU'){feRenaming=false;return;}
      if(b==='UP'){
        if(simKbdRow===-1)simKbdRow=3;
        else if(simKbdRow===0){simKbdRow=-1;simKbdCol=simKbdCol>=5?1:0;}
        else simKbdRow--;
      }
      if(b==='DOWN'){
        if(simKbdRow===-1){simKbdRow=0;simKbdCol=simKbdCol===1?8:4;}
        else if(simKbdRow===3){simKbdRow=-1;simKbdCol=simKbdCol>=5?1:0;}
        else simKbdRow++;
      }
      if(b==='LEFT'){
        if(simKbdRow===-1)simKbdCol=simKbdCol===1?0:1;
        else simKbdCol=(simKbdCol-1+10)%10;
      }
      if(b==='RIGHT'){
        if(simKbdRow===-1)simKbdCol=simKbdCol===0?1:0;
        else simKbdCol=(simKbdCol+1)%10;
      }

      if(b==='CLICK'){
        if(simKbdRow===-1&&simKbdCol===0){
          if(simNamingBuffer.length>0)simNamingBuffer=simNamingBuffer.slice(0,-1);
        } else if(simKbdRow===-1&&simKbdCol===1){
          // Save rename
          const l=feList();
          if(simNamingBuffer&&l[feSel]){
            l[feSel].n=simNamingBuffer+(feExt?'.'+feExt:'');
          }
          feRenaming=false;
        } else if(simKbdRow>=0&&simKbdRow<4&&simKbdCol>=0&&simKbdCol<10){
          if(simNamingBuffer.length<24){
            simNamingBuffer+=simKbdRows[simKbdRow][simKbdCol];
          }
        }
      } else if(b==='SHUTTER'){
        const l=feList();
        if(simNamingBuffer&&l[feSel]){
          l[feSel].n=simNamingBuffer+(feExt?'.'+feExt:'');
        }
        feRenaming=false;
      }
      return;
    }

    if(feConfirm){if(b==='LEFT'||b==='RIGHT')feYes=!feYes;else if(b==='CLICK'){if(feYes){const l=feList();l.splice(feSel,1);if(feSel>=l.length)feSel=Math.max(0,l.length-1);}feConfirm=false;}else if(b==='MENU')feConfirm=false;return;}
    if(feView){if(b==='MENU'||b==='LEFT')feView=false;return;}
    if(b==='MENU'){mode='MENU';return;}
    if(b==='LEFT'){if(fePath==='/'){mode='MENU';}else{fePath=fePath.substring(0,fePath.lastIndexOf('/'))||'/';feSel=0;}return;}
    const l=feList();
    if(b==='UP'&&l.length)feSel=(feSel-1+l.length)%l.length;
    if(b==='DOWN'&&l.length)feSel=(feSel+1)%l.length;
    if(b==='HOLD'&&l.length&&!l[feSel].d){
      feRenaming=true;
      const base=l[feSel].n.replace(/\.[^/.]+$/,'');
      const dot=l[feSel].n.lastIndexOf('.');
      feExt=dot>0?l[feSel].n.slice(dot+1):'';
      simNamingBuffer=base;
      simKbdRow=-1;simKbdCol=1; // Focus on SAVE
      return;
    }
    if(b==='SHUTTER'&&l.length&&!l[feSel].d){feConfirm=true;feYes=false;}
    if(b==='CLICK'&&l.length){if(l[feSel].d){fePath=(fePath==='/'?'':fePath)+'/'+l[feSel].n;feSel=0;}
      else if(l[feSel].n.match(/jpg/i))feView=true;}
    return;
  }
  if(mode==='NRF'){if(b==='MENU')mode='MENU';return;}
  if(mode==='WIFI'){
    if(b==='MENU')mode='MENU';
    if(b==='RIGHT')mode='BLE';
    if(b==='CLICK')wifiAtk=(wifiAtk+1)%5;
    if(b==='UP'){simWifiSel=(simWifiSel-1+apsList.length)%apsList.length;playChirp(440,0.03);}
    if(b==='DOWN'){simWifiSel=(simWifiSel+1)%apsList.length;playChirp(440,0.03);}
    if(b==='SHUTTER'){
      const target=apsList[simWifiSel];
      simDeauthUntil=Date.now()+1800;
      playChirp(880,0.08);
      // Simulate client re-association and WPA2 handshake capture
      setTimeout(()=>{
        simHandshakeUntil=Date.now()+4000;
        simHandshakeSsid=target[2];
        const pcapPath='/HANDSHAKES/'+target[2]+'.pcap';
        FS[pcapPath]='[PCAP_EAPOL_4WAY_HANDSHAKE_DATA_BURST: BSSID='+target[4]+']';
        playTone(1200,0.12);
      }, 1200);
    }
    return;
  }
  if(mode==='BLE'){
    if(simFoxHunting){
      if(b==='MENU'||b==='SHUTTER'){simFoxHunting=false;playChirp(350,0.05);return;}
      if(b==='UP'||b==='DOWN'||b==='CLICK'){playChirp(900,0.02);}
      return;
    }
    if(b==='MENU')mode='MENU';
    if(b==='LEFT')mode='WIFI';
    if(b==='CLICK'){bleAtk=(bleAtk+1)%7;blePkts=0;}
    if(b==='UP'){simBleSel=(simBleSel-1+bleDvList.length)%bleDvList.length;playChirp(440,0.03);}
    if(b==='DOWN'){simBleSel=(simBleSel+1)%bleDvList.length;playChirp(440,0.03);}
    if(b==='SHUTTER'){
      simFoxHunting=true;
      playTone(950,0.1);
    }
    return;
  }
  if(mode==='SUBGHZ'){if(b==='MENU')mode='MENU';if(b==='SHUTTER'){sgHasCap=true;sgStatus='RX 40 pulses S/N 0x5A3C1 b1';sgColor=C.green;}
    if(b==='RIGHT'){sgStatus='TX EV1527 0x5A3C1 btn 1';sgColor=C.green;}if(b==='CLICK'&&sgHasCap){sgStatus='Replaying captured train';sgColor=C.crimson;}return;}
  if(mode==='IR'){if(b==='MENU')mode='MENU';if(b==='SHUTTER'){irHas=true;}if(b==='CLICK'){}return;}
  if(mode==='SETTINGS'){
    if(setConfirm){if(b==='LEFT'||b==='RIGHT')setYes=!setYes;else if(b==='CLICK')setConfirm=false;else if(b==='MENU')setConfirm=false;return;}
    const items=buildSettings();
    if(b==='MENU'){mode='MENU';return;}
    if(b==='UP'){do{setSel=(setSel-1+items.length)%items.length;}while(items[setSel].h);}
    if(b==='DOWN'){do{setSel=(setSel+1)%items.length;}while(items[setSel].h);}
    const id=items[setSel].id,d=b==='RIGHT'?1:b==='LEFT'?-1:0;
    if(d&&id){
      if(id==='startMode'){
        settings.startMode=(settings.startMode+d+startModeNames.length)%startModeNames.length;
      }
      else if(id==='sound')settings.sound=!settings.sound;
      else if(id==='prefix'){
        let idx=presetPrefixes.indexOf(settings.imgPrefix);
        idx=(idx+d+presetPrefixes.length)%presetPrefixes.length;
        settings.imgPrefix=presetPrefixes[idx];
      }
      else if(id==='imgIndex'){
        settings.imgIndex=Math.max(1,settings.imgIndex+d);
      }
      else if(id==='prompt')settings.promptNaming=!settings.promptNaming;
      else if(id in settingCycle)settings[id]=(settings[id]+d+settingCycle[id])%settingCycle[id];
      else if(id in settingAdjust){const[st,mn,mx]=settingAdjust[id];settings[id]=Math.max(mn,Math.min(mx,settings[id]+d*st));}
      else if(id==='prev')settings.prev=settings.prev?0:1;
      else if(id==='flip')settings.flip=!settings.flip;else if(id==='mir')settings.mir=!settings.mir;
    }
    if(b==='CLICK'){
      if(id==='startMode'){
        settings.startMode=(settings.startMode+1)%startModeNames.length;
      }
      else if(id==='sound')settings.sound=!settings.sound;
      else if(id==='prefix'){
        let idx=presetPrefixes.indexOf(settings.imgPrefix);
        idx=(idx+1)%presetPrefixes.length;
        settings.imgPrefix=presetPrefixes[idx];
      }
      else if(id==='prompt')settings.promptNaming=!settings.promptNaming;
      else if(id==='bench')benchVal='1420KB/s';else if(id==='health')healthVal='PASS';
      else if(id==='erase'){setConfirm=true;setYes=false;}
      else if(id==='files'){mode='FILES';fePath='/';feSel=0;}
      else if(id==='cfgExport'){
        const iniContent = `# AXIONTOOL SMART CONFIG\n[SYSTEM]\noperator_callsign = ${settings.callsign}\nstartup_mode = ${settings.startMode}\nbrightness = ${settings.bright}\nsound_enabled = ${settings.sound}\n\n[RADIO_AND_TACTICAL]\nwifi_hop_delay_sec = ${settings.hop}\nauto_save_pcap = ${settings.autoPcap}\nfoxhunt_sensitivity = ${settings.foxSens}\n\n[STORAGE_AND_NAMING]\nimage_prefix = ${settings.imgPrefix}\nnext_image_index = ${settings.imgIndex}\nprompt_naming = ${settings.promptNaming}\n`;
        FS['/axion_config.ini'] = iniContent;
        configExportStatus = 'SAVED OK';
        playTone(2000, 0.12);
      }
      else if(id==='cfgReload'){
        if(FS['/axion_config.ini']){
          configExportStatus = 'LOADED OK';
          playTone(2200, 0.15);
        } else {
          configExportStatus = 'NO FILE';
          playTone(700, 0.1);
        }
      }
      else if(id==='about')mode='ABOUT';
      else if(id==='reset'){settings={callsign:'OPERATOR_01',startMode:0,bright:80,sound:true,scene:0,stillRes:3,stillQ:6,cbri:0,ccon:1,csat:0,csharp:2,cden:4,cev:0,cgain:2,cwb:0,prev:0,flip:true,mir:false,grid:1,hop:1,imgPrefix:'image',imgIndex:1,promptNaming:true,autoPcap:true,foxSens:65};}
      else if(id==='save')mode='MENU';
    }
    return;
  }
  if(mode==='GUIDE'){
    if(b==='MENU')mode='MENU';
    if(b==='RIGHT'||b==='CLICK')guidePage=(guidePage+1)%GUIDE_DOCS.length;
    if(b==='LEFT')guidePage=(guidePage-1+GUIDE_DOCS.length)%GUIDE_DOCS.length;
    return;
  }
  if(mode==='ABOUT'){if(b==='MENU'||b==='CLICK')mode='SETTINGS';return;}
}
window.addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(e.key==='ArrowUp'){e.preventDefault();handleInput('UP');}
  if(e.key==='ArrowDown'){e.preventDefault();handleInput('DOWN');}
  if(e.key==='ArrowLeft'){e.preventDefault();handleInput('LEFT');}
  if(e.key==='ArrowRight'){e.preventDefault();handleInput('RIGHT');}
  if(e.key==='Enter'||e.key===' '){e.preventDefault();handleInput('CLICK');}
  if(k==='s'){e.preventDefault();handleInput(e.shiftKey?'HOLD':'SHUTTER');}
  if(k==='m'||e.key==='Escape'){e.preventDefault();handleInput('MENU');}
});

// Use real XBM icon data if icons_data.js is present (bit 0 = foreground)
if(typeof iconsData!=='undefined'){
  const MAP={cam:44,gallery:49,sd:47,note:14,game:15,spectrum:6,radio:8,wifi:11,bt:2,subghz:45,ir:46,info:17,cfg:43};
  drawIcon=function(x,y,kind,col,bg){
    const id=MAP[kind];
    if(id==null||!iconsData[id]){ctx.fillStyle=bg;ctx.fillRect(x,y,22,22);drawGlyph(x,y,kind,col);return;}
    const bytes=iconsData[id];ctx.fillStyle=bg;ctx.fillRect(x,y,22,22);ctx.fillStyle=col;
    for(let r=0;r<22;r++)for(let b=0;b<3;b++){const bv=bytes[r*3+b];for(let bit=0;bit<8;bit++){const cx=b*8+bit;
      if(cx<22&&!(bv&(1<<bit)))ctx.fillRect(x+cx,y+r,1,1);}}
  };
}
requestAnimationFrame(render);
</script>
